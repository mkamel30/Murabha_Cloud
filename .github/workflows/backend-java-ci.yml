name: Backend Java CI

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-java-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-java-ci.yml'

jobs:
  build:
    name: Build and Test Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/backend-java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile & Test
        working-directory: backend-java
        run: |
          chmod +x mvnw
          ./mvnw clean test
