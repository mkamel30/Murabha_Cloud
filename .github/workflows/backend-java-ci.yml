name: Backend Java CI

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-java-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-java-ci.yml'

jobs:
  build:
    name: Build and Test Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/backend-java/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile & Test
        working-directory: backend-java
        env:
          JWT_SECRET: 4c3e2b1a5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a
        run: |
          chmod +x mvnw
          ./mvnw clean test

      - name: Print Test Failures
        if: failure()
        run: |
          for f in backend-java/target/surefire-reports/*.txt; do
            [ -f "$f" ] && echo "================ $f ================" && cat "$f"
          done
