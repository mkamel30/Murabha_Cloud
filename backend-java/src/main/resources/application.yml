spring:
  application:
    name: murabha-cloud-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  jpa:
    open-in-view: true
  thymeleaf:
    check-template-location: false

server:
  port: 3008 # Default port running alongside Node (3007)
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
    cookie-name: refreshToken
  cors:
    allowed-origins:
      - "http://localhost:2436"
      - "http://localhost:3000"
      - "http://localhost:3007"
      - "http://localhost:3008"
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  mfa:
    master-secret: ${APP_MFA_MASTER_SECRET:}
  rate-limit:
    login-capacity: 30
    login-duration-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
